name: Notify subscribers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: "Besked til gæsterne om, hvad der er nyt"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    # Ved push: kør kun hvis commit-beskeden indeholder [notify]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[notify]')
    steps:
      - name: Send notification
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: |
          # Fjern [notify]-tagget fra beskeden
          CLEAN_MESSAGE="${MESSAGE//\[notify\]/}"
          curl -sS -L -X POST "$NOTIFY_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg secret "$NOTIFY_SECRET" --arg message "$CLEAN_MESSAGE" \
                  '{secret: $secret, message: $message}')"
